# Shared settings. Profile-specific values live in application-dev.yml / application-prod.yml.
spring:
  application:
    name: portfolio
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    cache: true
  mail:
    properties:
      # Fail fast instead of hanging the contact form request if SMTP is unreachable
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  forward-headers-strategy: framework   # behind Caddy
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

portfolio:
  contact:
    recipient: ${CONTACT_RECIPIENT:rahul@gurung.ch}
    max-per-window: 5     # submissions per IP address ...
    window: 10m           # ... within this window
    retention: 365d       # privacy notice: messages deleted after one year
