# Shared settings. Profile-specific values live in application-dev.yml / application-prod.yml.
spring:
  application:
    name: portfolio
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    cache: true
  web:
    resources:
      # Templates link /css/site-<hash>.css, so browsers may cache static files for a year
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**
      cache:
        cachecontrol:
          max-age: 365d
  mail:
    properties:
      # Fail fast instead of hanging the contact form request if SMTP is unreachable
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  compression:
    enabled: true   # Caddy compresses in production too; this keeps direct runs (CI, Lighthouse) realistic
    mime-types: text/html,text/css,image/svg+xml,text/plain
  forward-headers-strategy: framework   # behind Caddy
  servlet:
    session:
      # Only the admin area creates sessions (ADR 0005)
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # An SMTP outage must not mark the site as down: the contact form keeps the message and reports success
      enabled: false

portfolio:
  contact:
    recipient: ${CONTACT_RECIPIENT:rahul@gurung.ch}
    max-per-window: 5     # submissions per IP address ...
    window: 10m           # ... within this window
    retention: 365d       # privacy notice: messages deleted after one year
  admin:
    # Empty values disable the admin login; generate them with AdminSetup (README, ADR 0005)
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    totp-secret: ${ADMIN_TOTP_SECRET:}
