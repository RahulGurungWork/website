<!DOCTYPE html>
<!--/* Page layout. A page uses it with
	<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
and supplies its own <title> and <main id="main">. Model attributes come from LayoutModelAdvice. */-->
<html th:fragment="layout(title, content)" lang="en" th:lang="${lang}" th:with="l=${lang} ?: 'en'"
	xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:replace="${title}">Rahul Gurung</title>
	<meta name="description" th:content="#{site.description}">
	<link th:each="alternate : ${alternateUrls}" rel="alternate" th:hreflang="${alternate.key}"
		th:href="${alternate.value}">
	<link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
	<link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
	<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
	<a class="skip" href="#main" th:text="#{layout.skip}">Skip to main content</a>

	<header class="site-header">
		<div class="wrap header-row">
			<a class="logo" th:href="@{/{l}(l=${l})}"><span class="visually-hidden">Rahul Gurung, </span><span
					aria-hidden="true">R<span class="dot">.</span> Gurung</span><span class="visually-hidden"
					th:text="#{nav.home}">Home</span></a>
			<nav class="nav" th:aria-label="#{nav.label}">
				<ul class="nav-links">
					<li><a th:href="@{/{l}(l=${l})}" th:aria-current="${page == ''} ? 'page' : null"
							th:text="#{nav.home}">Home</a></li>
					<li><a th:href="@{/{l}/projects(l=${l})}"
							th:aria-current="${page == '/projects'} ? 'page' : (${#strings.startsWith(page, '/projects/')} ? 'true' : null)"
							th:text="#{nav.projects}">Projects</a></li>
					<li><a th:href="@{/{l}/certificates(l=${l})}"
							th:aria-current="${page == '/certificates'} ? 'page' : null"
							th:text="#{nav.certificates}">Certificates</a></li>
					<li><a th:href="@{/{l}/contact(l=${l})}" th:aria-current="${page == '/contact'} ? 'page' : null"
							th:text="#{nav.contact}">Contact</a></li>
				</ul>
				<ul class="lang" th:aria-label="#{lang.label}">
					<li th:each="link : ${languageLinks}">
						<a th:href="@{${link.value}}" th:lang="${link.key}" th:hreflang="${link.key}"
							th:aria-current="${link.key == l} ? 'true' : null"><span aria-hidden="true"
								th:text="${#strings.toUpperCase(link.key)}">EN</span><span class="visually-hidden"
								th:text="#{__${'lang.name.' + link.key}__}">English</span></a>
					</li>
				</ul>
			</nav>
		</div>
	</header>

	<main id="main" th:replace="${content}">
		<p>Page content</p>
	</main>

	<footer class="site-footer">
		<div class="wrap footer-row">
			<ul>
				<li><a href="https://github.com/RahulGurungWork" rel="noopener">GitHub</a></li>
				<li><a href="https://www.linkedin.com/in/rahul-gurung-4076a1339/" rel="noopener">LinkedIn</a></li>
				<li><a th:href="@{/{l}/legal-notice(l=${l})}" th:text="#{footer.legalNotice}">Legal notice</a></li>
				<li><a th:href="@{/{l}/privacy(l=${l})}" th:text="#{footer.privacy}">Privacy</a></li>
			</ul>
			<small>© <span th:text="${#dates.year(#dates.createNow())}">2026</span> Rahul Gurung</small>
		</div>
	</footer>
</body>
</html>
