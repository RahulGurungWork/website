<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{error.404.title}">Page not found – Rahul Gurung</title>
</head>
<body>
	<main id="main" class="section">
		<div class="wrap">
			<div class="error-page">
				<p class="eyebrow">404</p>
				<h1 th:text="#{error.404.heading}">Page not found</h1>
				<p th:text="#{error.404.text}">This page does not exist, or it is not online yet.</p>
				<p><a class="btn btn-brand" th:href="@{/{l}(l=${lang} ?: 'en')}" th:text="#{error.home}">Back to the
						home page</a></p>
			</div>
		</div>
	</main>
</body>
</html>
