<!DOCTYPE html>
<html th:replace="~{layout/admin :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{admin.dashboard.title}">Admin – Rahul Gurung</title>
</head>
<body>
	<main id="main" class="section">
		<div class="wrap">
			<div class="section-head">
				<span class="eyebrow" th:text="#{admin.label}">Admin</span>
				<h1 th:text="#{admin.dashboard.heading}">Dashboard</h1>
				<p th:text="#{admin.dashboard.loggedInAs(${adminUser})}">Logged in as admin.</p>
			</div>
			<!--/* Sections arrive in steps A2 to A4 (docs/hermes/08-admin-panel.md). */-->
			<h2 th:text="#{admin.dashboard.next}">Coming next</h2>
			<ul class="plain-list">
				<li th:text="#{admin.dashboard.projects}">Projects: create, edit, publish and order</li>
				<li th:text="#{admin.dashboard.certificates}">Certificates: create, edit and delete</li>
				<li th:text="#{admin.dashboard.messages}">Messages from the contact form</li>
			</ul>
		</div>
	</main>
</body>
</html>
