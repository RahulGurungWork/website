<!DOCTYPE html>
<html th:replace="~{layout/admin :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{admin.dashboard.title}">Admin – Rahul Gurung</title>
</head>
<body>
	<main id="main" class="section">
		<div class="wrap">
			<div class="section-head">
				<span class="eyebrow" th:text="#{admin.label}">Admin</span>
				<h1 th:text="#{admin.dashboard.heading}">Dashboard</h1>
				<p th:text="#{admin.dashboard.loggedInAs(${adminUser})}">Logged in as admin.</p>
			</div>
			<h2 th:text="#{admin.dashboard.manage}">Manage</h2>
			<ul class="plain-list">
				<li><a th:href="@{/{l}/admin/projects(l=${lang})}" th:text="#{admin.dashboard.projects}">Projects:
						create, edit, publish and order</a></li>
				<li><a th:href="@{/{l}/admin/certificates(l=${lang})}"
						th:text="#{admin.dashboard.certificatesManage}">Certificates: add, edit, order and delete</a></li>
			</ul>
			<!--/* Messages arrive in step A4 (docs/hermes/08-admin-panel.md). */-->
			<h2 th:text="#{admin.dashboard.next}">Coming next</h2>
			<ul class="plain-list">
				<li th:text="#{admin.dashboard.messages}">Messages from the contact form</li>
			</ul>
		</div>
	</main>
</body>
</html>
