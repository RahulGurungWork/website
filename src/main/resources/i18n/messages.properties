about.eyebrow=About
about.heading=About me
about.apprenticeship=I'm in the first years of my apprenticeship as an Informatiker EFZ Applikationsentwicklung (application development), with vocational school at gibb in Bern.
about.dates=My apprenticeship runs from August 2025 to August 2029.
about.motivation=What I enjoy most about software is solving problems and learning something new. The field keeps changing, so there is always more to understand.
about.vorlehre=Before the apprenticeship I attended a pre-apprenticeship (Vorlehre), where I designed interfaces in Figma, used AI tools with deliberate prompt engineering and planned projects from start to finish.
about.beyond=Outside IT I take part in a philosophy club and play table tennis. In a learners' circle at BAND I held the Lead Link role.
