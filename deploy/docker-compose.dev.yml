# Local development services only (the app itself runs from the IDE or ./mvnw spring-boot:run).
#   docker compose -f deploy/docker-compose.dev.yml up -d
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql

  mail:
    image: axllent/mailpit:latest   # catches outgoing mail; UI on http://localhost:8025
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata-dev:
