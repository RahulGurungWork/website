name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # Pinned: Playwright 1.52 has no Chromium build for newer Ubuntu releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      # Browser tests (*BrowserIT, BrowserFlowsIT) need Chromium and its system libraries
      - name: Install Chromium for Playwright
        run: |
          ./mvnw -B -q test-compile
          ./mvnw -B -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"

      # Unit, feature, integration and browser tests (Testcontainers uses the runner's Docker)
      - name: Build and verify
        run: ./mvnw -B verify

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Still to come in M7: Lighthouse CI.
