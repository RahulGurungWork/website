# Continuous deployment (draft until M8). Manual trigger only until the VPS exists;
# switch to `on: push: branches: [main]` once the server and secrets are set up
# (go-live steps: docs/hermes/07-go-live.md).
#
# Required repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      # Image names must be lowercase; the owner is "RahulGurungWork"
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/portfolio/deploy
            APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }} docker compose pull app
            APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }} docker compose up -d

      - name: Smoke test
        run: ./deploy/smoke-test.sh https://www.portfolio.rahul.gurung.ch
