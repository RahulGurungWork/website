# Continuous deployment: every push to main whose CI run passes goes live (steps: docs/hermes/07-go-live.md).
# Can also be started by hand (Actions → Deploy → Run workflow) to redeploy main.
#
# The image is public on ghcr.io, so the server needs no registry login. The server's host key is pinned in
# deploy/known_hosts. Required secret (environment "production"): DEPLOY_SSH_KEY, a key that can only run
# ~/bin/portfolio-deploy on the server (deploy/deploy.sh).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a running deploy is never cancelled halfway
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rahulgurungwork/portfolio
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tests already ran in CI for this commit; the Dockerfile skips them
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://www.portfolio.rahul.gurung.ch
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          tar -czf - -C deploy docker-compose.yml Caddyfile \
            | ssh -i ~/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=deploy/known_hosts ubuntu@179.237.124.160 "$SHA"

      - name: Smoke test
        run: ./deploy/smoke-test.sh https://www.portfolio.rahul.gurung.ch

      - name: Remove key
        if: always()
        run: rm -f ~/deploy_key
